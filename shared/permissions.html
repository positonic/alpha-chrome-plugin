<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Microphone Permission</title>
    <script src="theme.js"></script>
    <style>
      :root,
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #f6f7f9;
        --surface: #ffffff;
        --border: #e3e6ec;
        --text: #0f1729;
        --text-muted: #667085;
        --primary: #2d68e5;
        --primary-hover: #2457c5;
        --success: #12a150;
        --error: #dc2626;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0b1020;
        --surface: #111829;
        --border: #1e283d;
        --text: #e8ebf2;
        --text-muted: #8a93a8;
        --primary: #3b82f6;
        --primary-hover: #2f6fe0;
        --success: #22c55e;
        --error: #f87171;
      }
      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }
      .container {
        text-align: center;
        padding: 40px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        max-width: 400px;
      }
      h2 { color: var(--text); margin-bottom: 12px; }
      p { color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; }
      button {
        padding: 12px 24px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 8px;
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover { background: var(--primary-hover); }
      .status { margin-top: 16px; font-size: 14px; }
      .success { color: var(--success); }
      .error { color: var(--error); }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Microphone Access</h2>
      <p>This extension needs microphone access for voice dictation. Click the button below to grant permission.</p>
      <button id="grantBtn">Grant Microphone Access</button>
      <div class="status" id="status"></div>
    </div>
    <script src="permissions.js"></script>
  </body>
</html>
